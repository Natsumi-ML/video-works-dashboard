/* CTAを押した行に一手間だけ動きを付けてから工程を進める（§10.6）。
   render() が DOM を作り直すので、アニメが終わってから advance する。
   動きを止めている環境（prefers-reduced-motion）では待たずに進める */
function todayAdvance(r, rowEl){
  if(!writable()) return;
  var last=(nextStatus(r.status)==="投稿済み");
  var reduce=false;
  try{ reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches; }catch(e){}
  if(reduce || !rowEl){ if(last) TODAY_DONE_OPEN=true; advance(r); return; }
  rowEl.classList.add(last?"finish":"step");
  setTimeout(function(){
    if(last) TODAY_DONE_OPEN=true;   /* どこへ移ったのか見えるように開く */
    advance(r);
  }, last?300:340);
}

/* 「負荷目安」。工数ではない。重みは LOAD_CFG に出してある（§12.4） */
function loadOf(name){
  var rows=rowsOfMonth(), weekEnd=addDays(TODAY,7);
  var o={today:0, week:0, overdue:0, review:0, open:0, waiting:0, todo:0};
  rows.forEach(function(r){
    if(r.editor!==name || r.status==="投稿済み") return;
    o.open++;
    /* 「今日やる分」は超過ぶんも含む。1本を二重に数えない */
    if(r.planned<=TODAY || r.due<=TODAY) o.today++;
    if(r.planned<TODAY || r.due<TODAY) o.overdue++;
    if(r.due>TODAY && r.due<=weekEnd) o.week++;
    if(r.status==="確認中") o.review++;
    else if(r.status==="投稿待ち") o.waiting++;
    else if(r.status==="未着手") o.todo++;
  });
  var raw = o.today*LOAD_CFG.today + o.week*LOAD_CFG.week
          + o.overdue*LOAD_CFG.overdue + o.review*LOAD_CFG.review;
  o.score = Math.min(100, Math.round(raw/LOAD_CFG.full*100));
  o.band = o.score<50 ? {k:"easy", t:"余裕あり", v:"--st-todo"}
         : o.score<70 ? {k:"fit",  t:"適正",    v:"--st-posted"}
         : o.score<85 ? {k:"many", t:"やや多い", v:"--st-review"}
         :              {k:"hot",  t:"高負荷",  v:"--st-waiting"};
  return o;
}
/* チーム負荷KPI（§25.2）：全体の負荷／高負荷／低負荷／期限超過リスク */
function loadKpiStrip(loads){
  var names=Object.keys(loads), hot=0, low=0, over=0, sum=0;
  names.forEach(function(n){
    sum+=loads[n].score; over+=loads[n].overdue;
    if(loads[n].score>=85) hot++;
    if(loads[n].score<50) low++;
  });
  var avg=names.length ? Math.round(sum/names.length) : 0;
  var g=h("div",{class:"kpis four"});
  g.appendChild(kpiCard("g-critical","チーム全体の負荷","gauge", avg,"%",
    [avg>=85?"高め":avg>=70?"やや高め":"適正の範囲です"], avg));
  g.appendChild(kpiCard("g-blue","高負荷メンバー","alert", hot,"人",
    ["全"+names.length+"人中・負荷目安85以上"]));
  g.appendChild(kpiCard("g-teal","低負荷メンバー","check", low,"人",
    ["全"+names.length+"人中・負荷目安50未満"]));
  g.appendChild(kpiCard("g-orange","期限超過リスク","alertCircle", over,"件",
    ["対応が必要な案件"]));
  return g;
}
/* 負荷調整の提案（§26）。0件なら描画自体を行わない。提案は動画単位。
   システムは自動で担当変更しない。確定操作は社員のみ */
function loadSuggestions(loads){
  var names=Object.keys(loads);
  var subs=[];
  names.forEach(function(from){
    if(loads[from].score<85) return;
    /* 最も余裕のある移動先（負荷70未満）を1人選ぶ */
    var to=null;
    names.forEach(function(n){
      if(n===from || loads[n].score>=70) return;
      if(!to || loads[n].score<loads[to].score) to=n;
    });
    if(!to) return;
    /* 動かしてよいのは未着手だけ（進行中の担当を変えると混乱する） */
    var cand=rowsOfMonth().filter(function(r){ return r.editor===from && r.status==="未着手"; })
      .sort(function(a,b){ return a.due<b.due?-1:1; })[0];
    if(!cand) return;
    subs.push({video:cand, from:from, to:to});
  });
  return subs;
}

function weekBars(){

  var vals=week.map(function(d){return byDay[d]}), max=Math.max(1,Math.max.apply(null,vals));

function calGrid(){
  var rows=calRows(), byDay={};
  rows.forEach(function(r){ (byDay[r.planned]=byDay[r.planned]||[]).push(r); });

  var wrap=h("div",{class:"calwrap"});
  var tbl=h("table",{class:"caltable"});
  var hr=h("tr");
  ["日","月","火","水","木","金","土"].forEach(function(w,i){
    hr.appendChild(h("th",{class:i===0?"sun":i===6?"sat":"",text:w}));
  });
  tbl.appendChild(hr);

  var a=MONTH.split("-"), y=+a[0], m=+a[1];
  var first=ymd(y,m,1), lead=dow(first), n=daysInMonth(MONTH);
  var cells=[]; /* 前月の埋め草は数字なしの空マス（情報を詰めない §27.4） */
  for(var i=0;i<lead;i++) cells.push(null);
  for(var d=1;d<=n;d++) cells.push(ymd(y,m,d));
  while(cells.length%7) cells.push(null);

  for(var wI=0;wI<cells.length;wI+=7){
    var tr=h("tr");
    for(var ci=0;ci<7;ci++){
      var day=cells[wI+ci];
      if(!day){ tr.appendChild(h("td",{class:"empty"})); continue; }
      /* 土・日・祝はセル全体を同じ灰色で塗る（§27.3） */
      var w=dow(day), off=(w===0||w===6||isHoliday(day));
      var cls="cd"+(off?" off":"")+(CALSEL===day?" sel":"")+(day===TODAY?" today":"");
      var td=h("td",{class:cls,tabindex:"0",role:"button",
        "aria-label":jpDate(day)+"日 "+((byDay[day]||[]).length)+"件"});
      (function(dd){
        td.addEventListener("click", function(){ CALSEL=dd; render(); });
        td.addEventListener("keydown", function(e){ if(e.key==="Enter"){ CALSEL=dd; render(); } });
      })(day);
      var numCls = w===0||isHoliday(day) ? "sun" : w===6 ? "sat" : "";
      td.appendChild(h("div",{class:"dn "+numCls,text:String(+day.slice(8))}));
      var evs=byDay[day]||[];
      evs.slice(0,2).forEach(function(r){
        var c=contractById(r.contractId)||{display:r.client};
        var ev=h("div",{class:"ev"});
        var dt=h("i"); dt.style.background="var("+sv(r.status).v+")";
        ev.appendChild(dt);
        ev.appendChild(h("span",{text:r.title||(c.display+" "+r.kind)}));
        td.appendChild(ev);
      });
      if(evs.length>2) td.appendChild(h("div",{class:"evmore",text:"他"+(evs.length-2)+"件"}));
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  wrap.appendChild(tbl);
  return wrap;
}

   クライアント管理（§29〜34）。社員のみの新設ページ
   ===================================================================== */
var CLSEL=null, CLFILTER={plan:"__all__", editor:"__all__", material:"__all__"};
var MATERIAL_STEPS=["未依頼","分析・ハイライト作成中","社員対応待ち","資料完成"];
var PLAN_STATUSES=["未着手","進行中","確認待ち","完了"];
/* クライアント単位の集計。目標＝契約本数の合計、投稿済み＝当月rows */
function clientAgg(name){
  var cs=SEED_CONTRACTS.filter(function(c){ return c.client===name; });
  var goal=0, ids={};
  cs.forEach(function(c){ goal+=c.count; ids[c.id]=1; });
  var posted=0, editors={}, late=0;
  rowsOfMonth().forEach(function(r){
    if(!ids[r.contractId]) return;
    if(r.status==="投稿済み") posted++;
    else if(r.planned<TODAY) late++;
    if(r.editor) editors[r.editor]=1;
  });
  var cd=clientDrive(name);
  return {name:name, display:(cs[0]||{}).display||name, contractId:(cs[0]||{}).id,
          goal:goal, posted:posted, late:late, editors:Object.keys(editors),
          cd:cd, pct:pct(posted,goal)};
}
/* 資料準備の遅延（§33.2：毎月12日まで＝分析・ハイライト完成目標） */
function materialLate(cd){
  var st=cd.materialStatus||"未依頼";
  return (st==="未依頼"||st==="分析・ハイライト作成中") && TODAY > MONTH+"-12";
}
/* 資料準備状況チップ（完成イメージ 06 の色分け）。遅延時は赤を優先 */
function matChip(cd){
  var st=cd.materialStatus||"未依頼";
  var cls = materialLate(cd) ? "mchip late"
    : st==="分析・ハイライト作成中" ? "mchip warn"
    : st==="社員対応待ち" ? "mchip pur"
    : st==="資料完成" ? "mchip ok"
    : "pchip";
  return h("span",{class:cls,text:st});
}
function clientAlerts(){
  var out={planLate:[], goalRisk:[], matLate:[]};
  clientNames().forEach(function(n){
    var a=clientAgg(n);
    if(a.cd.planningDeadline && a.cd.planningDeadline<TODAY &&
       (a.cd.planningStatus||"未着手")!=="完了") out.planLate.push(a);
    if(a.late>0) out.goalRisk.push(a);
    if(materialLate(a.cd)) out.matLate.push(a);
  });
  return out;
}

  var c=contractById(r.contractId)||{display:r.client};

function driveButtons(clientName){

/**
 * 生成結果を既存行へマージする。
 * 「未着手かつ未ロックの行」だけを新しい配置に差し替え、進行中・固定済みの行は動かさない。
 * 契約本数が減って未着手だけでは削りきれない場合は無音にせず overflow で返す。
 */
function merge(target, plan){
  var others  = STATE.rows.filter(function(r){ return r.month!==target; });
  var keptAll = STATE.rows.filter(function(r){ return r.month===target && (r.status!=="未着手" || r.dateLocked); });
  var byC={}; keptAll.forEach(function(r){ (byC[r.contractId]=byC[r.contractId]||[]).push(r); });
  var out=[], overflow=[];
  SEED_CONTRACTS.forEach(function(c){
    var kept = byC[c.id] || [];
    var over = kept.length - c.count;
    if(over>0) overflow.push(c.display+" "+c.kind+" "+over+"本");
    var used={}; kept.forEach(function(r){ used[r.planned]=1; });
    var fresh = plan.filter(function(r){ return r.contractId===c.id && !used[r.planned]; });
    var need = Math.max(0, c.count - kept.length);
    out = out.concat(kept, fresh.slice(0, need));
  });
  STATE.rows = others.concat(out);
  STATE.rows.sort(function(a,b){ return a.planned<b.planned?-1:a.planned>b.planned?1:0; });
  return {overflow:overflow, added:out.length-keptAll.length};
}
function nextMonth(ym){ var a=ym.split("-"),y=+a[0],m=+a[1]+1; if(m>12){m=1;y++;} return ymd(y,m,1).slice(0,7); }

function showToast(msg, undo){
  if(LAST_TOAST) LAST_TOAST.remove();
  var t=h("div",{class:"toast",role:"status"},[h("span",{text:msg})]);
  if(undo) t.appendChild(h("button",{text:"元に戻す",onclick:function(){ t.remove(); LAST_TOAST=null; undo(); }}));
  document.body.appendChild(t); LAST_TOAST=t;
  setTimeout(function(){ if(LAST_TOAST===t){ t.remove(); LAST_TOAST=null; } },5000);
}

var _PREV_VIEW=null;
function render(){
  /* スクロール位置の維持は「同じ画面の再描画」のときだけ。
     画面を切り替えたら必ず最上部から表示する（ホーム→動画一覧→ホーム 等） */
  var sameView = (_PREV_VIEW===VIEW);
  _PREV_VIEW = VIEW;
  var sy = sameView ? (window.scrollY||0) : 0;
  var d0=document.querySelector(".detail"), t0=document.querySelector(".taskscroll"), c0=document.querySelector(".cscroll");
  var dTop=d0?d0.scrollTop:0, tTop=t0?t0.scrollTop:0, cTop=c0?c0.scrollTop:0;

  var root=document.getElementById("root");
  root.innerHTML="";
  /* 動画を選べるビューは同じ詳細パネルを使う（§6.1）。
     チーム負荷はスタッフを見る画面で動画の選択が無いため出さない */
  var showDetail=!!DETAIL_VIEWS[VIEW];
  var mob=mobile();
  /* 常設の右カラムはホームのみ。今日・動画一覧はドロワー（完成イメージ・§24） */
  var drawerMode = showDetail && VIEW!=="home";
  /* ホーム(desktop)の詳細はシェル第3カラムではなく下段2カラム内のカード（完成イメージ01） */
  var homeInline = showDetail && VIEW==="home" && !mob;
  var shell=h("div",{class:"shell"+((showDetail&&!homeInline)?"":" nodetail")
    +(drawerMode?" drawerdetail":"")+(mob?" mob":"")});
  shell.appendChild(Sidebar());

  var main=h("div",{class:"main"});
  main.appendChild(Header());
  var wrap=h("div",{class:"wrap"});
  var bs=blockers();
  if(bs.length) wrap.appendChild(topBar(bs[0]));

  /* クライアント管理は社員のみ（§3.2）。UI非表示に加えてルート側でも守る */
  if(VIEW==="client" && myRole()!=="社員") VIEW="home";
  /* 廃止ルートの保険（進行トラック→動画一覧、投稿待ち→動画一覧の絞り込み） */
  if(VIEW==="track") VIEW="list";
  if(VIEW==="pending"){ VIEW="list"; FILTER.status="投稿待ち"; }

  if(VIEW==="home"){
    /* モバイルは My Tasks を最上段に（§37：編集スタッフが最短で作業開始できる順） */
    if(mob){
      /* モバイルのホームは「最優先」カード → My Tasks のみ（2026-08-28 指示）。
         他のKPI・停滞中カードは出さない */
      wrap.appendChild(homePriorityCard());
      wrap.appendChild(MyTasksCard());
    } else {
      /* 完成イメージ01：KPI全幅 → 左（My Tasks＋停滞中）／右（動画詳細カード） */
      wrap.appendChild(homeKpis());
      var hduo=h("div",{class:"homeduo"});
      var hleft=h("div",{class:"homeleft"});
      hleft.appendChild(MyTasksCard());
      hleft.appendChild(homeStalled());
      hduo.appendChild(hleft);
      var hdp=DetailPanel();
      hdp.classList.add("incard");
      hduo.appendChild(hdp);
      wrap.appendChild(hduo);
    }
  } else if(VIEW==="list"){
    wrap.appendChild(panelList());
  } else if(VIEW==="today"){
    wrap.appendChild(panelToday());
  } else if(VIEW==="load"){
    wrap.appendChild(panelLoad());
  } else if(VIEW==="calendar"){
    wrap.appendChild(panelCalendar());
  } else if(VIEW==="client"){
    wrap.appendChild(panelClient());
  }
  main.appendChild(wrap);
  shell.appendChild(main);
  if(showDetail && !homeInline) shell.appendChild(DetailPanel());
  root.appendChild(shell);

  if(POP || HKPOP){
    var bd1=h("div",{class:"backdrop",onclick:function(){ POP=false; HKPOP=null; render(); }});
    bd1.style.background="transparent"; bd1.style.zIndex="55";
    root.appendChild(bd1);
  }
  if(showDetail && DRAWER && (narrow() || drawerMode)){
    root.appendChild(h("div",{class:"backdrop",onclick:function(){ DRAWER=false; render(); }}));
  }
  if(mob){
    if(MNAV) root.appendChild(h("div",{class:"backdrop",style:"z-index:65",
      onclick:function(){ MNAV=false; render(); }}));
    root.appendChild(BottomNav());
  }

  if(sameView){
    var d1=document.querySelector(".detail"); if(d1) d1.scrollTop=dTop;
    var t1=document.querySelector(".taskscroll"); if(t1) t1.scrollTop=tTop;
    var c1=document.querySelector(".cscroll"); if(c1) c1.scrollTop=cTop;
  }
  window.scrollTo(0,sy);
}

/* ---- サンプル生成（初回のみ・明示的にサンプルと分かる形で） ---- */
function seedSample(){
  var ym=monthOf(TODAY);
  var rows=generate({contracts:SEED_CONTRACTS, ym:ym, genDate:"2026-07-15", shifts:SEED_SHIFTS, staff:STAFF_MAP});
  var caps={}; Object.keys(STAFF_MAP).forEach(function(n){ caps[n]=capacityOf(SEED_SHIFTS,STAFF_MAP[n],ym).cap||1; });
  assignEditors(rows, caps);
  // 進捗を決定的に散らす（過去分は概ね投稿済、一部を残して遅延を作る）
  var seed=7;
  rows.forEach(function(r,i){
    seed=(seed*1103515245+12345)&0x7fffffff;
    var rnd=(seed>>>8)%100;
    if(r.planned < TODAY){
      if(rnd<86){ r.status="投稿済み"; r.postedAt=r.planned; r.trans={"投稿済み":toUTC(r.planned)}; }
      else if(rnd<93){ r.status="投稿待ち"; r.trans={"投稿待ち":toUTC(addDays(r.planned,-1))}; }
      else { r.status="確認中"; r.trans={"確認中":toUTC(addDays(r.planned,-4))}; }
    } else if(r.planned===TODAY){
      r.status = rnd<50 ? "投稿待ち" : "確認中";
      r.trans={}; r.trans[r.status]=toUTC(addDays(TODAY,-2));
    } else {
      r.status = rnd<40 ? "未着手" : rnd<70 ? "編集中" : rnd<88 ? "確認中" : "投稿待ち";
      r.trans={}; if(r.status!=="未着手") r.trans[r.status]=toUTC(TODAY);
    }
  });
  return rows;
}

/* ---- 起動 ---- */
function boot(){
  STATE = readState();
  TODAY = fromUTC(Date.now() + 9*3600*1000); // Asia/Tokyo
  ME = LS.get("mlboard.me", null);
  if(!STATE.rows.length && !STATE.seeded){
    STATE.rows = seedSample();
    STATE.seeded = true;
  }
  MONTH = monthOf(TODAY);
  if(!STATE.rows.some(function(r){return r.month===MONTH})){
    var ms=monthList(); if(ms.length) MONTH=ms[ms.length-1];
  }
  var vs=visibleViews(); if(!vs.some(function(v){return v[0]===VIEW})) VIEW=vs[0][0];
  render();
  if(!ME) openWho();

  window.addEventListener("beforeunload", function(e){
    if(OPS.all().length){ e.preventDefault(); e.returnValue=""; }
  });

  /* Escape で ポップオーバー／ドロワー／モーダル を閉じる（§43） */
  document.addEventListener("keydown", function(e){
    if(e.key!=="Escape") return;
    closeModals();
    if(POP || HKPOP || DRAWER){ POP=false; HKPOP=null; DRAWER=false; render(); }
  });

  if(window.claude && claude.use){
    claude.use("artifact").then(function(api){
      ARTIFACT = api;
      if(!api){ CAN_WRITE=false; render(); return; }
      replayPending();
      render();
    }).catch(function(){ CAN_WRITE=false; render(); });
  } else {
    CAN_WRITE = false; render();
  }
}
boot();
